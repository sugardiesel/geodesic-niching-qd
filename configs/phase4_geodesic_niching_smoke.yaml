experiment:
  name: phase4_geodesic_niching_smoke
  seed: 1001
  env_config: configs/phase1_horseshoe.yaml
  output_dir: reproduced/phase4_smoke
  production_protocol: configs/production_protocol.yaml
  plot_title: Phase 4 geodesic-niching smoke test

algorithm:
  descriptor: learned_trajectory_autoencoder_latent
  archive_assignment: approximate_geodesic_nearest_centroid_in_2d_latent_space
  grid_bins: [10, 10]
  hidden_dim: 16
  total_evaluations: 300
  bootstrap_evaluations: 80
  retrain_evaluations: [160]
  init_scale: 0.7
  mutation_sigma: 0.18
  mutation_probability: 0.10
  log_interval: 50

trajectory:
  sequence_length: 64
  features: [x, y, vx, vy, energy]

autoencoder:
  latent_dim: 2
  epochs: 5
  batch_size: 64
  learning_rate: 0.001
  validation_fraction: 0.15
  device: auto
  latent_bounds_padding_fraction: 0.15
  normalize: true
  derivative_loss_weight: 0.5

geodesic:
  graph_k: 20
  assignment_k: 20
  max_graph_points: 1000
  reservoir_strategy: rolling_recent_buffer
  include_archive_elites_in_support: false
  reservoir_seed:
  refresh_interval: 50
  selection_novelty_neighbors: 5
  selection_novelty_floor: 0.05
  approximation_note: Post-audit smoke test with deduplicated reciprocal edges, endpoint-only centroids, k=20, and finite disconnection penalties based on graph scale and support-set diameter.

metrics:
  qd_score_fitness_floor: -5.0
  pairwise_geodesic_k: 20
  pairwise_log_interval: 100
